<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>novel writer</title>

  <style>
    :root {
      --cream: #fffaf2;
      --paper: #fffdf9;
      --yellow: #f4df9b;
      --yellow-soft: #faf0c9;
      --brown: #735b4a;
      --brown-light: #a88f7d;
      --pink: #e9b7b5;
      --pink-soft: #f8dddd;
      --text: #57483e;
      --muted: #aa9a8e;
      --border: #eee2d6;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--cream);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans Thai",
        sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 28px 24px 40px;
    }

    /* Header */

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--yellow-soft);
      color: var(--brown);
      font-size: 19px;
    }

    .brand-name {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 21px;
      letter-spacing: 0.02em;
      color: var(--brown);
    }

    .save-status {
      font-size: 13px;
      color: var(--muted);
      transition: opacity 0.2s ease;
    }

    /* Main layout */

    .workspace {
      display: grid;
      grid-template-columns: 1fr 250px;
      gap: 24px;
      align-items: start;
    }

    .editor-card {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
    }

    .editor-top {
      padding: 24px 28px 18px;
      border-bottom: 1px solid var(--border);
    }

    .chapter-label {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .chapter-title {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--brown);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 27px;
      padding: 0;
    }

    .chapter-title::placeholder {
      color: #cbbdb2;
    }

    .editor {
      width: 100%;
      min-height: 570px;
      resize: vertical;
      border: 0;
      outline: 0;
      background: var(--paper);
      color: var(--text);
      padding: 30px 28px;
      font-family: Georgia, "Noto Serif Thai", "Times New Roman", serif;
      font-size: 17px;
      line-height: 1.9;
    }

    .editor::placeholder {
      color: #c5b7ad;
    }

    /* Sidebar */

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .stat-card {
      background: rgba(255, 253, 249, 0.85);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 7px;
    }

    .stat-number {
      color: var(--brown);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
    }

    .goal-card {
      background: var(--yellow-soft);
      border: 1px solid #f0e2b4;
      border-radius: 16px;
      padding: 18px;
    }

    .goal-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .goal-title {
      font-size: 13px;
      color: var(--brown);
    }

    .goal-percent {
      font-size: 12px;
      color: var(--brown-light);
    }

    .progress-track {
      height: 8px;
      background: rgba(255, 255, 255, 0.65);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--pink);
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    .goal-bottom {
      display: flex;
      justify-content: space-between;
      margin-top: 11px;
      font-size: 12px;
      color: var(--brown-light);
    }

    .goal-input {
      width: 80px;
      border: 0;
      border-bottom: 1px solid #d8c5a0;
      background: transparent;
      color: var(--brown);
      outline: none;
      text-align: right;
      padding: 2px 0;
    }

    .goal-input:focus {
      border-color: var(--pink);
    }

    .tip-card {
      background: var(--pink-soft);
      border: 1px solid #efd0ce;
      border-radius: 16px;
      padding: 18px;
    }

    .tip-title {
      font-size: 13px;
      color: var(--brown);
      margin-bottom: 7px;
    }

    .tip-text {
      margin: 0;
      font-family: Georgia, "Noto Serif Thai", serif;
      font-size: 13px;
      line-height: 1.7;
      color: #8d7169;
    }

    /* Bottom */

    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 15px 24px;
      border-top: 1px solid var(--border);
      background: #fffcf8;
      color: var(--muted);
      font-size: 12px;
    }

    .bottom-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
    }

    .bottom-stat strong {
      color: var(--brown);
      font-weight: 500;
    }

    .clear-button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      padding: 6px 8px;
      border-radius: 8px;
    }

    .clear-button:hover {
      background: var(--pink-soft);
      color: var(--brown);
    }

    /* Mobile */

    @media (max-width: 760px) {
      .app {
        padding: 18px 14px 28px;
      }

      header {
        margin-bottom: 18px;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
      }

      .tip-card {
        grid-column: 1 / -1;
      }

      .editor {
        min-height: 500px;
      }
    }

    @media (max-width: 480px) {
      .sidebar {
        grid-template-columns: 1fr;
      }

      .editor-top {
        padding: 20px 18px 15px;
      }

      .editor {
        padding: 24px 18px;
        font-size: 16px;
      }

      .bottom-bar {
        padding: 14px 18px;
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <div class="brand">
        <div class="brand-mark">✦</div>
        <div class="brand-name">novel writer</div>
      </div>

      <div class="save-status" id="saveStatus">
        saved
      </div>
    </header>


    <main class="workspace">

      <!-- Editor -->
      <section class="editor-card">

        <div class="editor-top">
          <div class="chapter-label">chapter</div>

          <input
            id="chapterTitle"
            class="chapter-title"
            type="text"
            placeholder="Untitled chapter"
            maxlength="120"
            autocomplete="off"
          >
        </div>

        <textarea
          id="editor"
          class="editor"
          placeholder="เริ่มเขียนเรื่องราวของคุณตรงนี้..."
          spellcheck="false"
        ></textarea>


        <div class="bottom-bar">

          <div class="bottom-stats">
            <div class="bottom-stat">
              <strong id="wordCount">0</strong> words
            </div>

            <div class="bottom-stat">
              <strong id="characterCount">0</strong> characters
            </div>
          </div>

          <button
            id="clearButton"
            class="clear-button"
            type="button"
          >
            clear
          </button>

        </div>

      </section>


      <!-- Tracker -->
      <aside class="sidebar">

        <div class="stat-card">
          <div class="stat-label">
            total words
          </div>

          <div class="stat-number" id="totalWords">
            0
          </div>
        </div>


        <div class="goal-card">

          <div class="goal-heading">
            <div class="goal-title">
              today's goal
            </div>

            <div class="goal-percent" id="goalPercent">
              0%
            </div>
          </div>

          <div class="progress-track">
            <div
              class="progress-bar"
              id="progressBar"
            ></div>
          </div>

          <div class="goal-bottom">
            <span id="goalCurrent">0 words</span>

            <input
              id="goalInput"
              class="goal-input"
              type="number"
              min="1"
              max="100000"
              value="2000"
              aria-label="Daily word goal"
            >
          </div>

        </div>


        <div class="stat-card">
          <div class="stat-label">
            writing progress
          </div>

          <div class="stat-number" id="remainingWords">
            2,000
          </div>

          <div
            style="
              margin-top: 5px;
              font-size: 12px;
              color: var(--muted);
            "
          >
            words remaining
          </div>
        </div>


        <div class="tip-card">

          <div class="tip-title">
            a little note
          </div>

          <p class="tip-text">
            ไม่จำเป็นต้องเขียนให้สมบูรณ์แบบ
            เขียนต่อไปทีละคำก็พอ ♡
          </p>

        </div>

      </aside>

    </main>

  </div>


  <script>
    /*
      ------------------------------------------------
      NOVEL WRITER
      ------------------------------------------------
      ข้อมูลทั้งหมดจะถูกบันทึกไว้ใน Browser
      ของเครื่องนี้ด้วย localStorage
      ------------------------------------------------
    */

    const editor = document.getElementById("editor");
    const chapterTitle = document.getElementById("chapterTitle");

    const wordCountElement = document.getElementById("wordCount");
    const characterCountElement = document.getElementById("characterCount");

    const totalWordsElement = document.getElementById("totalWords");

    const goalInput = document.getElementById("goalInput");
    const goalCurrent = document.getElementById("goalCurrent");
    const goalPercent = document.getElementById("goalPercent");
    const progressBar = document.getElementById("progressBar");

    const remainingWords = document.getElementById("remainingWords");

    const saveStatus = document.getElementById("saveStatus");
    const clearButton = document.getElementById("clearButton");


    /*
      -----------------------------------------------
      Storage keys
      -----------------------------------------------
    */

    const STORAGE = {
      text: "novelWriter_text",
      title: "novelWriter_title",
      goal: "novelWriter_goal"
    };


    /*
      -----------------------------------------------
      Count words
      -----------------------------------------------

      รองรับภาษาไทยด้วย Intl.Segmenter
      ถ้า Browser ไม่รองรับ จะใช้วิธี fallback
    */

    function countWords(text) {

      if (!text || !text.trim()) {
        return 0;
      }

      /*
        วิธีที่ดีที่สุดสำหรับภาษาไทย
      */

      if ("Segmenter" in Intl) {

        try {

          const segmenter = new Intl.Segmenter(
            "th",
            {
              granularity: "word"
            }
          );

          let count = 0;

          for (const segment of segmenter.segment(text)) {

            if (segment.isWordLike) {
              count++;
            }

          }

          return count;

        } catch (error) {
          // ใช้ fallback ด้านล่าง
        }
      }


      /*
        fallback สำหรับ Browser รุ่นเก่า
      */

      return text
        .trim()
        .split(/\s+/)
        .filter(Boolean)
        .length;
    }


    /*
      -----------------------------------------------
      Update statistics
      -----------------------------------------------
    */

    function updateStats() {

      const text = editor.value;

      const words = countWords(text);

      const characters = text.length;

      let goal = parseInt(goalInput.value, 10);

      if (!Number.isFinite(goal) || goal < 1) {
        goal = 2000;
        goalInput.value = goal;
      }

      /*
        Word count
      */

      wordCountElement.textContent =
        words.toLocaleString("en-US");

      /*
        Character count
      */

      characterCountElement.textContent =
        characters.toLocaleString("en-US");

      /*
        Total words
        */

      totalWordsElement.textContent =
        words.toLocaleString("en-US");

      /*
        Goal progress
      */

      const percentage = Math.min(
        100,
        Math.round((words / goal) * 100)
      );

      goalPercent.textContent =
        percentage + "%";

      progressBar.style.width =
        percentage + "%";

      goalCurrent.textContent =
        words.toLocaleString("en-US") + " words";

      /*
        Remaining words
      */

      const remaining = Math.max(
        0,
        goal - words
      );

      remainingWords.textContent =
        remaining.toLocaleString("en-US");
    }


    /*
      -----------------------------------------------
      Save
      -----------------------------------------------
    */

    let saveTimer = null;

    function saveData() {

      localStorage.setItem(
        STORAGE.text,
        editor.value
      );

      localStorage.setItem(
        STORAGE.title,
        chapterTitle.value
      );

      localStorage.setItem(
        STORAGE.goal,
        goalInput.value
      );

      saveStatus.textContent = "saved";

      clearTimeout(saveTimer);

      saveTimer = setTimeout(() => {
        saveStatus.textContent = "";
      }, 1800);
    }


    /*
      -----------------------------------------------
      Autosave
      -----------------------------------------------
    */

    function scheduleSave() {

      saveStatus.textContent = "saving...";

      clearTimeout(saveTimer);

      saveTimer = setTimeout(() => {
        saveData();
      }, 500);
    }


    /*
      -----------------------------------------------
      Load saved data
      -----------------------------------------------
    */

    function loadData() {

      const savedText =
        localStorage.getItem(STORAGE.text);

      const savedTitle =
        localStorage.getItem(STORAGE.title);

      const savedGoal =
        localStorage.getItem(STORAGE.goal);


      if (savedText !== null) {
        editor.value = savedText;
      }

      if (savedTitle !== null) {
        chapterTitle.value = savedTitle;
      }

      if (savedGoal !== null) {

        const goal = parseInt(
          savedGoal,
          10
        );

        if (
          Number.isFinite(goal) &&
          goal >= 1 &&
          goal <= 100000
        ) {
          goalInput.value = goal;
        }
      }

      updateStats();

      saveStatus.textContent = "saved";
    }


    /*
      -----------------------------------------------
      Events
      -----------------------------------------------
    */

    editor.addEventListener(
      "input",
      () => {
        updateStats();
        scheduleSave();
      }
    );


    chapterTitle.addEventListener(
      "input",
      () => {
        scheduleSave();
      }
    );


    goalInput.addEventListener(
      "input",
      () => {

        let value =
          parseInt(goalInput.value, 10);

        if (!Number.isFinite(value)) {
          value = 2000;
        }

        value = Math.max(
          1,
          Math.min(100000, value)
        );

        goalInput.value = value;

        updateStats();
        scheduleSave();
      }
    );


    /*
      -----------------------------------------------
      Clear button
      -----------------------------------------------
    */

    clearButton.addEventListener(
      "click",
      () => {

        const confirmed =
          window.confirm(
            "ลบข้อความในบทนี้ทั้งหมดหรือไม่?"
          );

        if (!confirmed) {
          return;
        }

        editor.value = "";

        updateStats();
        saveData();

        editor.focus();
      }
    );


    /*
      -----------------------------------------------
      Keyboard shortcut
      Ctrl + S / Cmd + S
      -----------------------------------------------
    */

    document.addEventListener(
      "keydown",
      (event) => {

        if (
          (event.ctrlKey || event.metaKey) &&
          event.key.toLowerCase() === "s"
        ) {

          event.preventDefault();

          saveData();
        }
      }
    );


    /*
      -----------------------------------------------
      Start
      -----------------------------------------------
    */

    loadData();

  </script>

</body>
</html>
